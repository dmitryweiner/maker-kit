<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1c2026" />
    <title>maker-kit showcase</title>
    <meta name="description" content="Every component of maker-kit in every state: the living design code of the 3D-printing tools." />
  </head>
  <body class="kit-app">
    <header class="topbar">
      <span class="brand">maker-kit</span>
      <button id="presetsOpen" class="preset-button" type="button" aria-haspopup="dialog" aria-expanded="false">My box</button>
      <span class="spacer"></span>
      <div class="topbar-tools">
        <button id="newProject" class="tool-button" type="button" data-i18n-label="kit.topbar.new">📄</button>
        <button id="savePreset" class="tool-button" type="button" data-i18n-label="kit.topbar.savePreset">💾</button>
        <button id="openFile" class="tool-button" type="button" data-i18n-label="kit.topbar.open">📂</button>
        <button id="saveFile" class="tool-button" type="button" data-i18n-label="kit.topbar.save">⬇️</button>
        <button id="undo" class="tool-button" type="button" data-i18n-label="kit.topbar.undo">↶</button>
        <button id="redo" class="tool-button" type="button" data-i18n-label="kit.topbar.redo">↷</button>
      </div>
      <span class="topbar-break"></span>
      <label class="lang-field">
        <span class="lang-globe" aria-hidden="true">🌐</span>
        <select id="lang" data-i18n-label="kit.topbar.language"></select>
      </label>
    </header>

    <div id="banner" class="banner bad" role="status" hidden>
      <span data-i18n="kit.storage.project.full"></span>
      <button id="bannerDismiss" class="link-button" type="button" data-i18n="kit.storage.dismiss"></button>
    </div>

    <div class="workspace">
      <main id="view" class="view">
        <div class="view-placeholder" aria-hidden="true"><div class="cube"></div></div>
        <div class="chips">
          <button class="chip" type="button" aria-pressed="true">Iso</button>
          <button class="chip" type="button" aria-pressed="false">Top</button>
          <button class="chip" type="button" aria-pressed="false">Front</button>
        </div>
        <div id="viewProgress" class="view-progress" hidden>
          <div id="progressLabel" class="progress-label" hidden></div>
          <div id="progressTrack" class="progress-track running" role="progressbar" data-i18n-label="kit.progress.building">
            <div id="progressFill" class="progress-fill"></div>
          </div>
        </div>
        <span id="viewStatus" class="view-status">60 × 30 mm · 12 ms</span>
        <button
          id="sheetOpen"
          class="sheet-open"
          type="button"
          aria-controls="panel"
          aria-expanded="false"
          data-i18n="kit.sheet.open"
        ></button>
      </main>

      <aside id="panel" class="panel" data-i18n-label="kit.sheet.open">
        <button id="sheetClose" class="sheet-handle" type="button" data-i18n-label="kit.sheet.close"></button>

        <section class="card">
          <h2 data-i18n="demo.showcase"></h2>
          <div id="showcasePanel"></div>
          <div class="segmented demo-buttons">
            <button id="jobsTwo" class="btn" type="button" data-i18n="demo.jobs.two"></button>
            <button id="jobsQuick" class="btn" type="button" data-i18n="demo.jobs.quick"></button>
            <button id="jobsExport" class="btn" type="button" data-i18n="demo.jobs.export"></button>
            <button id="jobsSteps" class="btn" type="button" data-i18n="demo.jobs.steps"></button>
          </div>
        </section>

        <section class="card">
          <h2 data-i18n="demo.controls"></h2>
          <div id="controlsPanel"></div>
        </section>

        <section class="card">
          <h2 data-i18n="demo.states"></h2>
          <div id="statesPanel"></div>
        </section>

        <section id="card_lid" class="fcard on">
          <button class="fcard-head" type="button" aria-expanded="true">
            <span class="fcard-title" data-i18n="demo.lid"></span>
            <span class="fcard-tag">M3</span>
            <span class="fcard-caret" aria-hidden="true">▾</span>
          </button>
          <div class="fcard-body">
            <p class="fcard-desc" data-i18n="demo.lid.desc"></p>
            <div id="lidPanel"></div>
          </div>
        </section>

        <section id="card_vents" class="fcard collapsed">
          <button class="fcard-head" type="button" aria-expanded="false">
            <span class="fcard-title" data-i18n="demo.vents"></span>
            <span class="fcard-caret" aria-hidden="true">▾</span>
          </button>
          <div class="fcard-body"><p class="fcard-desc" data-i18n="demo.vents.desc"></p></div>
        </section>

        <section class="card">
          <h2 data-i18n="demo.messages"></h2>
          <ul class="messages">
            <li class="message bad"><span data-i18n="demo.msg.bad"></span></li>
            <li class="message warn"><span data-i18n="demo.msg.warn"></span></li>
            <li class="message info"><span data-i18n="demo.msg.info"></span></li>
          </ul>
        </section>

        <section class="card">
          <h2 data-i18n="demo.buttons"></h2>
          <p><button class="btn primary wide" type="button" data-i18n="demo.download"></button></p>
          <p class="segmented">
            <button class="btn" type="button" data-i18n="demo.secondary"></button>
            <button class="btn" type="button" disabled data-i18n="demo.disabled"></button>
            <button class="btn danger" type="button" data-i18n="kit.preset.confirm"></button>
            <button class="link-button" type="button" data-i18n="demo.link"></button>
          </p>
        </section>

        <p class="demo-footer">
          <a href="https://github.com/dmitryweiner/maker-kit">github.com/dmitryweiner/maker-kit</a> · GPL-3.0-or-later
        </p>
      </aside>
    </div>

    <div id="presets" class="modal" hidden>
      <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="presetsTitle">
        <h2 id="presetsTitle" data-i18n="kit.topbar.presets"></h2>
        <button id="presetsClose" class="icon-button modal-close" type="button" data-i18n-label="kit.modal.close">✕</button>
        <div class="modal-body">
          <h3 class="preset-group" data-i18n="kit.preset.mine"></h3>
          <ul class="preset-list">
            <li class="preset-row">
              <input class="field" type="text" value="My box" data-i18n-label="kit.preset.rename" />
              <button class="icon-button" type="button" aria-label="Open">↗</button>
              <button class="icon-button" type="button" aria-label="Delete">🗑</button>
            </li>
            <li class="preset-row">
              <input class="field" type="text" value="Box 2" data-i18n-label="kit.preset.rename" />
              <button class="icon-button" type="button" aria-label="Open">↗</button>
              <button class="btn danger" type="button" data-i18n="kit.preset.confirm"></button>
            </li>
          </ul>
          <h3 class="preset-group" data-i18n="kit.preset.builtIn"></h3>
          <ul class="preset-list">
            <li class="preset-row">
              <button class="preset-pick" type="button" aria-current="true">
                <span class="preset-name"
                  ><span data-i18n="demo.preset.pi"></span> · <span class="preset-changed" data-i18n="kit.preset.changed"></span
                ></span>
                <span class="preset-note" data-i18n="demo.preset.pi.note"></span>
              </button>
            </li>
            <li class="preset-row">
              <button class="preset-pick" type="button">
                <span class="preset-name" data-i18n="demo.preset.esp"></span>
                <span class="preset-note" data-i18n="demo.preset.esp.note"></span>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
